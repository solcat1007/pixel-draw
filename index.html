<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>像素画板 · Pixel Draw v2.0</title>
<meta name="description" content="像素画板 v2.0：扩展调色板、撤销重做、PNG 导入导出、网格尺寸调节与一键分享">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<meta name="theme-color" content="#ec407a">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>

:root{
  --bg:#f4f5f7;
  --bg-glow:#ffffff;
  --surface:#ffffff;
  --surface-2:#fafbfc;
  --text:#16181d;
  --soft:#5d636e;
  --mute:#8b929e;
  --line:#e6e8ec;
  --accent:#26a69a;
  --accent-soft:#e6f4f2;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --ease:cubic-bezier(.4,0,.2,1);
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
}
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);
  background-image:radial-gradient(120% 80% at 50% 0%, var(--bg-glow) 0%, rgba(255,255,255,0) 62%);
  background-attachment:fixed;
  color:var(--text);
  min-height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px; -webkit-font-smoothing:antialiased;
}

.app{width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; gap:18px}

.head{text-align:center}
.head h1{font-size:22px; font-weight:600; letter-spacing:.5px}
.head p{font-size:13px; color:var(--mute); margin-top:6px}

.card{
  width:100%; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:20px; box-shadow:var(--shadow);
}

.row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center}
.label{font-size:12px; color:var(--soft); font-weight:600; min-width:32px}

.chip{
  padding:6px 13px; font-size:12px; font-weight:500; font-family:inherit;
  background:var(--surface); color:var(--soft);
  border:1px solid var(--line); border-radius:999px; cursor:pointer;
  transition:all .2s var(--ease);
}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.chip.active{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.14)}

.btn{
  padding:10px 18px; font-size:13px; font-weight:600; font-family:inherit;
  letter-spacing:1px; background:var(--accent); color:#fff;
  border:none; border-radius:var(--r-md); cursor:pointer;
  transition:transform .15s var(--ease), box-shadow .2s var(--ease);
  box-shadow:0 6px 20px rgba(0,0,0,.16);
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--soft); box-shadow:none}
.btn:disabled{opacity:.42; cursor:not-allowed; transform:none; box-shadow:none}

.lang{
  position:fixed; top:16px; right:16px; z-index:20;
  padding:7px 14px; font-size:12px; font-weight:600; font-family:inherit;
  background:var(--surface); color:var(--soft);
  border:1px solid var(--line); border-radius:999px; cursor:pointer;
  transition:all .2s var(--ease);
}
.lang:hover{border-color:var(--accent); color:var(--accent)}
.hint{font-size:12px; color:var(--mute); text-align:center; line-height:1.7}

canvas.px{
  width:100%; max-width:320px; aspect-ratio:1; display:block; margin:0 auto;
  border:1px solid var(--line); border-radius:var(--r-md);
  background:
    linear-gradient(45deg,#f0f0f0 25%,transparent 25%,transparent 75%,#f0f0f0 75%),
    linear-gradient(45deg,#f0f0f0 25%,#fff 25%,#fff 75%,#f0f0f0 75%);
  background-size:16px 16px; background-position:0 0,8px 8px;
  touch-action:none;
}
.palette{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:14px}
.sw{
  width:26px; height:26px; border-radius:7px; cursor:pointer;
  border:2px solid transparent; transition:transform .12s var(--ease);
  font-size:13px; line-height:22px; text-align:center; color:#fff;
}
.sw:hover{transform:scale(1.12)}
.sw.on{border-color:var(--text); box-shadow:0 0 0 2px var(--surface) inset}
.customColor{
  width:26px; height:26px; padding:0; border:2px solid var(--line);
  border-radius:7px; cursor:pointer; background:none; overflow:hidden;
}
.customColor::-webkit-color-swatch-wrapper{padding:0}
.customColor::-webkit-color-swatch{border:none; border-radius:5px}
.status{font-size:12px; color:var(--mute); text-align:center; min-height:18px; margin-top:10px}
.status b{color:var(--accent)}
input[type=file]{display:none}

@media (max-width:380px){ .btn{padding:9px 13px; font-size:12px} .sw{width:23px;height:23px} }

</style>
</head>
<body>
<button class="lang" id="langBtn" onclick="toggleLang()">EN</button>
<div class="app">

  <div class="head">
    <h1 id="t_title">像素画板</h1>
    <p id="t_sub">每一格，都是你的创意</p>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:12px"><span class="label" id="t_size">网格</span><div class="row" id="sizes"></div></div>
    <canvas class="px" id="px" width="320" height="320"></canvas>
    <div class="palette" id="palette"></div>
    <div class="status" id="status"></div>
  </div>

  <div class="row">
    <button class="btn ghost" id="undoBtn" onclick="undo()">撤销</button>
    <button class="btn ghost" id="redoBtn" onclick="redo()">重做</button>
    <button class="btn ghost" id="eraserBtn" onclick="toggleEraser()">橡皮擦</button>
    <button class="btn ghost" onclick="clearAll()">清空</button>
  </div>

  <div class="row">
    <button class="btn ghost" onclick="document.getElementById('importFile').click()">导入 PNG</button>
    <button class="btn ghost" onclick="exportPng()">导出 PNG</button>
    <button class="btn" onclick="share()">分享</button>
  </div>
  <input type="file" id="importFile" accept="image/png,image/*">

  <div class="hint" id="t_hint">点击或拖动绘制 · Shift + 点击取色 · Ctrl+Z 撤销</div>

</div>
<script>

/* ============================================================
 * 像素画板 v2.0
 * ------------------------------------------------------------
 * 画布逻辑：逻辑网格 N×N，数据存在 cells 二维数组，null 表示透明。
 *   绘制 = 改 cells → 重画整个画布；透明背景导出靠数据层实现。
 *
 * v2.0 新增：
 *   1. 调色板扩展到 24 色 + 自定义取色 + Shift 吸色 + 彩虹隐藏笔
 *   2. 撤销 / 重做栈（每笔一次快照，最多 40 步）
 *   3. PNG 导入（缩放到网格并采样颜色）与 Web Share 分享
 *   4. 网格尺寸 8/16/32/48/64 可调，切换时按比例重采样保留作品
 * ========================================================== */

const SIZES = [8,16,32,48,64];
const COLORS = [
  '#000000','#424242','#757575','#9e9e9e','#bdbdbd','#ffffff',
  '#d32f2f','#e53935','#f57c00','#fbc02d','#fdd835','#cddc39',
  '#388e3c','#4caf50','#00897b','#26a69a','#1976d2','#42a5f5',
  '#512da8','#7e57c2','#ec407a','#f06292','#795548','#8d6e63'
];

let N = 32;
let PIX = 320 / N;
let cells = [];
let current = '#000000';
let erasing = false;
let drawing = false;
let rainbowMode = false;
let undoStack = [], redoStack = [];
let lang = 'zh';

const px = document.getElementById('px');
const pctx = px.getContext('2d');
const MAX_HISTORY = 40;

/* ---------- 网格 ---------- */
function initGrid(){
  cells = [];
  for (let r=0;r<N;r++){
    const row = [];
    for (let c=0;c<N;c++) row.push(null);
    cells.push(row);
  }
}

/** 改变网格尺寸：按比例重采样，保留已有作品 */
function resizeGrid(n){
  if (n === N) return;
  pushHistory();
  const old = cells, oldN = N;
  N = n; PIX = 320 / N;
  initGrid();
  for (let y=0;y<N;y++){
    for (let x=0;x<N;x++){
      const ox = Math.min(oldN-1, Math.floor(x/N*oldN));
      const oy = Math.min(oldN-1, Math.floor(y/N*oldN));
      cells[y][x] = old[oy][ox];
    }
  }
  px.style.backgroundSize = PIX + 'px ' + PIX + 'px, ' + PIX + 'px ' + PIX + 'px';
  px.style.backgroundPosition = '0 0,' + (PIX/2) + 'px ' + (PIX/2) + 'px';
  buildSizes(); paint(); updateStatus();
}

function buildSizes(){
  const box = document.getElementById('sizes');
  box.innerHTML = '';
  SIZES.forEach(function(n){
    const b = document.createElement('button');
    b.className = 'chip' + (n === N ? ' active' : '');
    b.textContent = n + '×' + n;
    b.onclick = function(){ resizeGrid(n); };
    box.appendChild(b);
  });
}

/* ---------- 撤销 / 重做 ---------- */
/* 快照同时记录网格尺寸，撤销尺寸调整时也能还原 */
function snapshot(){ return { n:N, cells:cells.map(function(row){ return row.slice(); }) }; }
function pushHistory(){
  undoStack.push(snapshot());
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack = [];
  updateStatus();
}
function restore(s){
  N = s.n; PIX = 320 / N;
  cells = s.cells.map(function(row){ return row.slice(); });
  px.style.backgroundSize = PIX + 'px ' + PIX + 'px, ' + PIX + 'px ' + PIX + 'px';
  px.style.backgroundPosition = '0 0,' + (PIX/2) + 'px ' + (PIX/2) + 'px';
  buildSizes(); paint(); updateStatus();
}
function undo(){
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  restore(undoStack.pop());
}
function redo(){
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  restore(redoStack.pop());
}
function updateStatus(){
  document.getElementById('undoBtn').disabled = undoStack.length === 0;
  document.getElementById('redoBtn').disabled = redoStack.length === 0;
  const L = I18N[lang];
  document.getElementById('status').innerHTML =
    L.gridLabel + ' <b>' + N + '×' + N + '</b>　·　' + L.strokes + ' <b>' + undoStack.length + '</b>' +
    (rainbowMode ? '　·　<b style="color:#ab47bc">🌈 ' + L.rainbow + '</b>' : '');
}

/* ---------- 调色板 ---------- */
function buildPalette(){
  const box = document.getElementById('palette');
  box.innerHTML = '';

  COLORS.forEach(function(col){
    const s = document.createElement('div');
    s.className = 'sw' + (col === current && !erasing && !rainbowMode ? ' on' : '');
    s.style.background = col;
    s.title = col;
    s.onclick = function(){
      current = col; erasing = false; rainbowMode = false;
      buildPalette(); updateStatus();
    };
    box.appendChild(s);
  });

  // 自定义颜色：原生取色器，保持单文件无依赖
  const picker = document.createElement('input');
  picker.type = 'color';
  picker.className = 'customColor';
  picker.title = I18N[lang].custom;
  picker.value = current;
  picker.oninput = function(){
    current = picker.value; erasing = false; rainbowMode = false;
    buildPalette(); updateStatus();
  };
  box.appendChild(picker);

  // Shift + 点击取色：橡皮位
  const e = document.createElement('div');
  e.className = 'sw' + (erasing ? ' on' : '');
  e.style.background = '#ffffff';
  e.style.border = '1px dashed var(--line)';
  e.textContent = '⌫';
  e.onclick = function(){ toggleEraser(); };
  box.appendChild(e);

  // 隐藏彩蛋：彩虹笔，激活后按坐标循环取色
  const rb = document.createElement('div');
  rb.className = 'sw' + (rainbowMode ? ' on' : '');
  rb.style.background = 'conic-gradient(#ef5350,#ffca28,#66bb6a,#42a5f5,#ab47bc,#ef5350)';
  rb.textContent = '🌈';
  rb.title = I18N[lang].rainbow;
  rb.onclick = function(){
    rainbowMode = !rainbowMode;
    erasing = false;
    if (rainbowMode) eggUnlock('pixel-rainbow', '彩虹笔解锁 · 让色彩流淌');
    buildPalette(); updateStatus();
  };
  box.appendChild(rb);
}

function toggleEraser(){
  erasing = !erasing;
  rainbowMode = false;
  buildPalette(); updateStatus();
}

/* ---------- 绘制 ---------- */
function paint(){
  pctx.clearRect(0,0,320,320);
  for (let r=0;r<N;r++){
    for (let c=0;c<N;c++){
      if (cells[r][c]){
        pctx.fillStyle = cells[r][c];
        pctx.fillRect(c*PIX, r*PIX, PIX, PIX);
      }
    }
  }

  // 网格线：极淡灰色，避免干扰画面
  pctx.strokeStyle = 'rgba(0,0,0,.06)';
  pctx.lineWidth = 1;
  for (let i=0;i<=N;i++){
    pctx.beginPath(); pctx.moveTo(i*PIX,0); pctx.lineTo(i*PIX,320); pctx.stroke();
    pctx.beginPath(); pctx.moveTo(0,i*PIX); pctx.lineTo(320,i*PIX); pctx.stroke();
  }

  // 彩蛋签名：解锁后始终在角落留下金色印记
  if (window.__eggSignature__){
    pctx.save();
    pctx.fillStyle = 'rgba(255,202,40,.85)';
    pctx.font = '12px ui-monospace,monospace';
    pctx.textAlign = 'right'; pctx.textBaseline = 'bottom';
    pctx.fillText('☠ SOLCAT', 316, 316);
    pctx.restore();
  }
}

/** 把鼠标/触摸坐标换算成格子坐标并落笔 */
function put(clientX, clientY, pickOnly){
  const rect = px.getBoundingClientRect();
  const x = Math.floor((clientX - rect.left) / rect.width  * N);
  const y = Math.floor((clientY - rect.top)  / rect.height * N);
  if (x < 0 || y < 0 || x >= N || y >= N) return;

  // Shift + 点击 = 吸色（取色器）
  if (pickOnly){
    if (cells[y][x]){
      current = cells[y][x];
      erasing = false; rainbowMode = false;
      buildPalette(); updateStatus();
    }
    return;
  }

  const color = rainbowMode
    ? 'hsl(' + ((x*13 + y*17 + Date.now()/12) % 360) + ',80%,55%)'
    : current;
  cells[y][x] = erasing ? null : color;
  paint();
}

function strokeStart(clientX, clientY, ev){
  pushHistory();
  put(clientX, clientY, ev && ev.shiftKey);
}

/* 鼠标事件 */
px.addEventListener('mousedown', function(e){ drawing = true; strokeStart(e.clientX, e.clientY, e); });
window.addEventListener('mouseup', function(){ drawing = false; });
px.addEventListener('mousemove', function(e){ if (drawing) put(e.clientX, e.clientY); });

/* 触摸事件 */
px.addEventListener('touchstart', function(e){
  drawing = true;
  strokeStart(e.touches[0].clientX, e.touches[0].clientY, null);
  e.preventDefault();
}, {passive:false});
px.addEventListener('touchmove', function(e){
  if (drawing) put(e.touches[0].clientX, e.touches[0].clientY);
  e.preventDefault();
}, {passive:false});
px.addEventListener('touchend', function(){ drawing = false; });

/* ---------- 文件操作 ---------- */
function clearAll(){
  pushHistory();
  initGrid(); paint(); updateStatus();
}

function exportPng(){
  const url = px.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pixel-art-' + N + 'x' + N + '.png';
  a.click();
}

/** 导入 PNG：缩放到 N×N 网格，逐格采样颜色（透明像素留空） */
function importPng(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      pushHistory();
      const tmp = document.createElement('canvas');
      tmp.width = N; tmp.height = N;
      const tc = tmp.getContext('2d');
      tc.drawImage(img, 0, 0, N, N);
      const data = tc.getImageData(0,0,N,N).data;
      for (let y=0;y<N;y++){
        for (let x=0;x<N;x++){
          const i = (y*N+x)*4;
          cells[y][x] = data[i+3] > 32
            ? 'rgb(' + data[i] + ',' + data[i+1] + ',' + data[i+2] + ')'
            : null;
        }
      }
      paint(); updateStatus();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/** 分享：优先系统分享面板，不支持则回退到下载 */
function share(){
  px.toBlob(function(blob){
    if (!blob){ exportPng(); return; }
    const file = new File([blob], 'pixel-art.png', { type:'image/png' });
    if (navigator.share && navigator.canShare && navigator.canShare({ files:[file] })){
      navigator.share({ files:[file], title:'我的像素画' }).catch(function(){ exportPng(); });
    } else {
      exportPng();
    }
  }, 'image/png');
}

/* ---------- 界面 ---------- */
const I18N = {
  zh:{ title:'像素画板', sub:'每一格，都是你的创意',
       hint:'点击或拖动绘制 · Shift + 点击取色 · Ctrl+Z 撤销',
       undo:'撤销', redo:'重做', eraser:'橡皮擦', clear:'清空',
       import:'导入 PNG', export:'导出 PNG', share:'分享',
       size:'网格', custom:'自定义颜色', rainbow:'彩虹笔',
       gridLabel:'画布', strokes:'笔画' },
  en:{ title:'Pixel Draw', sub:'Every pixel is your creation',
       hint:'Click or drag to draw · Shift+click to pick · Ctrl+Z to undo',
       undo:'Undo', redo:'Redo', eraser:'Eraser', clear:'Clear',
       import:'Import PNG', export:'Export PNG', share:'Share',
       size:'Grid', custom:'Custom color', rainbow:'Rainbow pen',
       gridLabel:'Canvas', strokes:'Strokes' }
};

function refresh(){
  const L = I18N[lang];
  document.getElementById('t_title').textContent = L.title;
  document.getElementById('t_sub').textContent = L.sub;
  document.getElementById('t_hint').textContent = L.hint;
  document.getElementById('t_size').textContent = L.size;
  document.getElementById('undoBtn').textContent = L.undo;
  document.getElementById('redoBtn').textContent = L.redo;
  document.getElementById('eraserBtn').textContent = L.eraser;
  document.getElementById('langBtn').textContent = (lang === 'zh') ? 'EN' : '中';
  buildPalette(); buildSizes(); updateStatus();
}
function toggleLang(){ lang = (lang === 'zh') ? 'en' : 'zh'; refresh(); }

/* ---------- 键盘快捷键 ---------- */
document.addEventListener('keydown', function(e){
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === 'z' && !e.shiftKey){ e.preventDefault(); undo(); }
  else if (k === 'y' || (k === 'z' && e.shiftKey)){ e.preventDefault(); redo(); }
});

/* ---------- 彩蛋接入 ---------- */
function eggUnlock(id, msg){
  const E = window.__SOLCAT_EGG__;
  if (!E || E.unlocked.has(id)) return;
  E.unlocked.add(id);
  E.onUnlock.forEach(function(fn){ try{ fn(id); }catch(e){} });
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:18%;left:50%;transform:translateX(-50%);z-index:99996;'+
    'background:rgba(18,20,26,.92);color:#ffca28;padding:12px 22px;border:1px solid #ffca28;'+
    'border-radius:12px;font:14px ui-monospace,monospace;pointer-events:none;'+
    'animation:eggIn .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.4)';
  t.textContent = '☠ ' + msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2400);
}

function initEgg(){
  const E = window.__SOLCAT_EGG__;
  if (!E) return;
  // 专属彩蛋：KONAMI / 彩虹笔解锁后，画布角落留下 SOLCAT 金色签名
  E.onUnlock.push(function(id){
    if (id === 'konami' || id === 'pixel-rainbow'){
      window.__eggSignature__ = true;
      paint();
    }
  });
}
document.addEventListener('DOMContentLoaded', initEgg);

/* ---------- 启动 ---------- */
document.getElementById('importFile').addEventListener('change', function(){
  importPng(this.files[0]);
  this.value = '';
});
refresh();
initGrid();
paint();

/* ---------- PWA 注册 ----------
 * 注册 Service Worker 后本页被缓存，断网也能打开。
 * 放在最后且 catch 掉异常：即使浏览器不支持也不影响正常功能。 */
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
<script>
/* ============================================================
 * SOLCAT EASTER EGG PROTOCOL v2.0 — 通用彩蛋引擎
 * 零依赖 · 单文件 · 可注入任意 HTML 项目
 * ============================================================ */
(function(){
  'use strict';
  if (window.__SOLCAT_EGG__) return;
  window.__SOLCAT_EGG__ = { version:'2.0', unlocked:new Set(), onUnlock:[] };

  var E = window.__SOLCAT_EGG__;
  var KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  var seq = [], logoClicks = 0, logoTimer = null;

  /* ---------- 1. 控制台署名（ASCII Art） ---------- */
  function banner(){
    var art = '%c\n  ____             _   _       _   _   \n' +
      ' / ___|  ___  _ __| |_(_) __ _| |_| |__  \n' +
      ' \\___ \\ / _ \\| \'__| __| |/ _` | __| \'_ \\ \n' +
      '  ___) | (_) | |  | |_| | (_| | |_| | | |\n' +
      ' |____/ \\___/|_|   \\__|_|\\__,_|\\__|_| |_|\n';
    console.log(art, 'color:#26a69a;font-family:monospace;font-weight:bold');
    console.log('%c☠ SOLCAT EASTER EGG PROTOCOL v2.0 — 你找到了隐藏入口',
      'color:#666;font-size:11px;letter-spacing:1px');
    console.log('%c提示：↑↑↓↓←→←→BA · 连点标题 5 次 · 输入 solcat · Ctrl+Shift+T',
      'color:#999;font-size:10px');
  }

  /* ---------- 2. 烟花彩带粒子 ---------- */
  function confetti(){
    var colors = ['#26a69a','#42a5f5','#ef5350','#ffca28','#ab47bc','#66bb6a','#ff7043'];
    var cvs = document.createElement('canvas');
    cvs.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999';
    document.body.appendChild(cvs);
    var ctx = cvs.getContext('2d'), W = cvs.width = innerWidth, H = cvs.height = innerHeight;
    var P = [];
    for (var i=0;i<180;i++) P.push({
      x:W/2+(Math.random()-.5)*120, y:H*.4+(Math.random()-.5)*40,
      vx:(Math.random()-.5)*18, vy:-Math.random()*16-4,
      c:colors[i%colors.length], s:Math.random()*8+4, r:Math.random()*6,
      life:1, spin:(Math.random()-.5)*.3
    });
    var f = 0;
    (function draw(){
      f++; ctx.clearRect(0,0,W,H);
      P.forEach(function(p){
        p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.vx*=.99; p.r+=p.spin; p.life-=.006;
        if(p.life<=0) return;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha=p.life;
        ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore();
      });
      if (f<180) requestAnimationFrame(draw); else cvs.remove();
    })();
  }

  /* ---------- 3. 隐藏开发者面板 ---------- */
  function devPanel(app){
    var old = document.getElementById('__egg_panel');
    if (old){ old.remove(); return; }
    var d = document.createElement('div');
    d.id='__egg_panel';
    d.style.cssText='position:fixed;bottom:20px;right:20px;z-index:99998;width:280px;'+
      'background:rgba(18,20,26,.94);color:#e0e0e0;border:1px solid #26a69a;border-radius:14px;'+
      'padding:18px;font:12px/1.7 ui-monospace,monospace;backdrop-filter:blur(12px);'+
      'box-shadow:0 12px 40px rgba(0,0,0,.4);animation:eggIn .3s ease';
    d.innerHTML='<div style="color:#26a69a;font-weight:bold;font-size:13px;margin-bottom:10px">'+
      '☠ SOLCAT 开发者模式</div>'+
      '<div>应用　　: '+app+'</div>'+
      '<div>协议　　: EGG PROTOCOL v'+E.version+'</div>'+
      '<div>解锁数　: '+E.unlocked.size+'</div>'+
      '<div>UA　　　: '+(navigator.userAgent.slice(0,38))+'…</div>'+
      '<div>屏幕　　: '+innerWidth+'×'+innerHeight+'</div>'+
      '<div>运行时间: '+Math.round(performance.now()/1000)+'s</div>'+
      '<div style="color:#888;margin-top:10px;border-top:1px solid #333;padding-top:8px">'+
      '已解锁: '+Array.from(E.unlocked).join(', ')+'</div>'+
      '<button onclick="this.parentNode.remove()" style="margin-top:12px;width:100%;padding:6px;'+
      'background:#26a69a;color:#fff;border:0;border-radius:6px;cursor:pointer">关闭</button>';
    document.body.appendChild(d);
  }

  /* ---------- 4. 隐藏主题（赛博朋克） ---------- */
  function cyberTheme(){
    var s=document.getElementById('__egg_cyber');
    if(s){ s.remove(); document.body.classList.remove('egg-cyber'); return; }
    s=document.createElement('style'); s.id='__egg_cyber';
    s.textContent='body.egg-cyber{filter:invert(1) hue-rotate(180deg)!important;}'+
      'body.egg-cyber *{font-family:"Courier New",monospace!important;letter-spacing:1px}';
    document.head.appendChild(s); document.body.classList.add('egg-cyber');
    unlock('cyber','☠ 赛博模式已启用');
  }

  /* ---------- 5. 解锁分发 ---------- */
  function unlock(id,msg){
    if (E.unlocked.has(id)) return;
    E.unlocked.add(id);
    if (msg) console.log('%c[EGG] '+msg,'color:#ffca28;font-weight:bold');
    E.onUnlock.forEach(function(fn){ try{fn(id);}catch(e){} });
    var t=document.createElement('div');
    t.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);'+
      'z-index:99997;background:rgba(18,20,26,.92);color:#ffca28;padding:18px 28px;'+ 
      'border:1px solid #ffca28;border-radius:12px;font:14px ui-monospace,monospace;'+
      'pointer-events:none;animation:eggIn .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.4)';
    t.textContent='☠ '+msg;
    document.body.appendChild(t); setTimeout(function(){t.remove();},2200);
  }

  /* ---------- 6. 事件绑定 ---------- */
  function init(){
    var app = document.title || 'SOLCAT App';
    banner();

    // Konami 秘籍
    addEventListener('keydown', function(e){
      var k = e.key.length===1 ? e.key.toLowerCase() : e.key;
      seq.push(k); if(seq.length>KONAMI.length) seq.shift();
      if (seq.length===KONAMI.length && KONAMI.every(function(v,i){return seq[i]===v;})){
        seq=[]; confetti(); unlock('konami','KONAMI CODE 已激活！');
      }
      // Ctrl+Shift+T → 赛博主题
      if (e.ctrlKey && e.shiftKey && (e.key==='T'||e.key==='t')){
        e.preventDefault(); cyberTheme();
      }
      // 输入 solcat
      if (e.key==='Enter' && window.__eggBuf__ === 'solcat'){ cyberTheme(); window.__eggBuf__=''; }
      if (k.length===1) window.__eggBuf__ = ((window.__eggBuf__||'')+k).slice(-10);
    });

    // 连点标题 5 次 → 开发者面板
    addEventListener('DOMContentLoaded', function(){
      var targets = document.querySelectorAll('h1,.head h1,.logo,header h1');
      var t = targets[0];
      if(t){ t.style.cursor='default'; t.addEventListener('click',function(){
        logoClicks++;
        clearTimeout(logoTimer);
        logoTimer=setTimeout(function(){logoClicks=0;},900);
        if(logoClicks>=5){ logoClicks=0; devPanel(app); unlock('dev','开发者模式已解锁'); }
      });}
      // 给 body 加动画 keyframe
      var a=document.createElement('style');
      a.textContent='@keyframes eggIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}';
      document.head.appendChild(a);
    });

    console.log('%c☠ 彩蛋引擎已加载 — 祝你玩得开心','color:#26a69a');
  }

  if (document.readyState==='loading') addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>
